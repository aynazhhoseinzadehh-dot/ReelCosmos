services:

  postgres:
    image: postgres:latest

    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secret

    ports:
      - "1345:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:latest

    ports:
      - "1344:6379"



  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: reelcosmos-backend

    depends_on:
      - postgres
      - redis

    ports:
      - "8080:8080"

    environment:

      DATABASE_URL: jdbc:postgresql://postgres:5432/mydatabase
      DATABASE_USERNAME: myuser
      DATABASE_PASSWORD: secret

      REDIS_HOST: redis
      REDIS_PORT: 6379



  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: reelcosmos-frontend

    depends_on:
      - backend

    ports:
      - "80:80"


volumes:

  postgres_data: